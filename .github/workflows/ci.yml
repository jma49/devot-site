name: CI

# Changes reach main only through a PR that passed here.
# `check` and `e2e` are the required checks; keep their names stable.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm tokens:check
      - run: pnpm facts
      - run: pnpm test

  e2e:
    # WebKit on Linux cannot play the H.264 clips, so the browser tests run on macOS like Safari.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium webkit
      - name: Probe media decoding (temporary)
        continue-on-error: true
        run: |
          sysctl -n hw.model machdep.cpu.brand_string; sw_vers; pmset -g batt || true
          system_profiler SPDisplaysDataType | head -20
          cat > "$RUNNER_TEMP/vt.swift" <<'EOF'
          import VideoToolbox
          print("VTIsHardwareDecodeSupported AV1:", VTIsHardwareDecodeSupported(kCMVideoCodecType_AV1))
          print("VTIsHardwareDecodeSupported H264:", VTIsHardwareDecodeSupported(kCMVideoCodecType_H264))
          print("VTIsHardwareDecodeSupported VP9:", VTIsHardwareDecodeSupported(kCMVideoCodecType_VP9))
          EOF
          swift "$RUNNER_TEMP/vt.swift" || true
          cat > "$RUNNER_TEMP/probe.mjs" <<'EOF'
          // Temporary CI probe: how WebKit handles the site's AV1 WebM and H.264 MP4 clips.
          import { createServer } from 'node:http'
          import { readFile } from 'node:fs/promises'
          import { extname, join } from 'node:path'

          const repo = process.argv[2]
          const { webkit } = await import(join(repo, 'node_modules/@playwright/test/index.mjs'))
          const root = join(repo, 'public')
          const types = { '.webm': 'video/webm', '.mp4': 'video/mp4' }

          const server = createServer(async (req, res) => {
            const path = new URL(req.url, 'http://x').pathname
            if (path === '/') {
              res.writeHead(200, { 'content-type': 'text/html' })
              return res.end('<!doctype html><title>probe</title><body></body>')
            }
            let body
            try {
              body = await readFile(join(root, path))
            } catch {
              res.writeHead(404)
              return res.end()
            }
            const type = types[extname(path)] ?? 'application/octet-stream'
            const range = /bytes=(\d+)-(\d*)/.exec(req.headers.range ?? '')
            if (range) {
              const start = Number(range[1])
              const end = range[2] ? Number(range[2]) : body.length - 1
              res.writeHead(206, {
                'content-type': type,
                'accept-ranges': 'bytes',
                'content-range': `bytes ${start}-${end}/${body.length}`,
                'content-length': end - start + 1,
              })
              return res.end(body.subarray(start, end + 1))
            }
            res.writeHead(200, { 'content-type': type, 'accept-ranges': 'bytes', 'content-length': body.length })
            res.end(body)
          })
          await new Promise((resolve) => server.listen(Number(process.env.PROBE_PORT ?? 4467), resolve))
          const base = `http://localhost:${server.address().port}`

          const AV1 = 'video/webm; codecs="av01.0.05M.08"'
          const cases = {
            'site order (AV1 WebM, then MP4)': [
              ['/media/card-2/card-2.webm', AV1],
              ['/media/card-2/card-2.mp4', 'video/mp4'],
            ],
            'AV1 WebM only': [['/media/card-2/card-2.webm', AV1]],
            'MP4 only': [['/media/card-2/card-2.mp4', 'video/mp4']],
          }

          const browser = await webkit.launch()
          const report = async (label, sources, setup) => {
            const page = await browser.newPage()
            const consoleLines = []
            page.on('console', (m) => consoleLines.push(`${m.type()}: ${m.text()}`))
            const requests = []
            page.on('request', (r) => {
              if (/\.(webm|mp4)$/.test(r.url())) requests.push(new URL(r.url()).pathname)
            })
            if (setup) await setup(page)
            await page.goto(base + '/')
            const state = await page.evaluate(async (sources) => {
              const t0 = performance.now()
              const log = []
              const video = document.createElement('video')
              video.muted = true
              video.loop = true
              video.playsInline = true
              video.width = 400
              for (const name of ['loadstart', 'loadedmetadata', 'loadeddata', 'canplay', 'playing', 'waiting', 'stalled', 'suspend', 'error', 'emptied', 'abort']) {
                video.addEventListener(name, () => log.push(`${Math.round(performance.now() - t0)} ${name} rs=${video.readyState} ns=${video.networkState}`))
              }
              let firstTime = null
              video.addEventListener('timeupdate', () => {
                if (firstTime === null && video.currentTime > 0) {
                  firstTime = Math.round(performance.now() - t0)
                  log.push(`${firstTime} timeupdate>0`)
                }
              })
              for (const [src, type] of sources) {
                const source = document.createElement('source')
                source.src = src
                source.type = type
                source.addEventListener('error', () => log.push(`${Math.round(performance.now() - t0)} source error ${src}`))
                video.append(source)
              }
              document.body.append(video)
              video.load()
              let play = 'pending'
              video.play().then(() => (play = 'resolved'), (e) => (play = `rejected ${e.name}`))
              await new Promise((r) => setTimeout(r, 8000))
              return {
                currentSrc: video.currentSrc.replace(location.origin, ''),
                paused: video.paused,
                currentTime: video.currentTime,
                readyState: video.readyState,
                networkState: video.networkState,
                error: video.error ? `${video.error.code} ${video.error.message}` : null,
                play,
                log,
              }
            }, sources)
            console.log(`\n## ${label}\n${JSON.stringify({ ...state, requests, console: consoleLines }, null, 1)}`)
            await page.close()
          }

          const page = await browser.newPage()
          await page.goto(base + '/')
          console.log(
            '## support',
            JSON.stringify(
              await page.evaluate(async (AV1) => {
                const v = document.createElement('video')
                const info = async (contentType) => {
                  try {
                    const r = await navigator.mediaCapabilities.decodingInfo({
                      type: 'file',
                      video: { contentType, width: 1280, height: 720, bitrate: 1e6, framerate: 30 },
                    })
                    return `${r.supported}/${r.smooth}/${r.powerEfficient}`
                  } catch (e) {
                    return String(e)
                  }
                }
                return {
                  canPlayAV1: v.canPlayType(AV1),
                  canPlayWebM: v.canPlayType('video/webm'),
                  canPlayMP4: v.canPlayType('video/mp4'),
                  mcAV1: await info(AV1),
                  mcH264: await info('video/mp4; codecs="avc1.640028"'),
                  ua: navigator.userAgent,
                }
              }, AV1),
              null,
              1,
            ),
          )
          await page.close()

          for (const [label, sources] of Object.entries(cases)) await report(label, sources)
          await report('site order, WebM request aborted', cases['site order (AV1 WebM, then MP4)'], (p) =>
            p.route('**/*.webm', (route) => route.abort()),
          )
          await browser.close()
          server.close()
          EOF
          node "$RUNNER_TEMP/probe.mjs" "$GITHUB_WORKSPACE"
      - run: pnpm build
      - run: pnpm test:dist
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
